name: Release pre-release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Pre-release stage (ignored if custom_version is set)
        required: false
        type: choice
        options:
          - beta
          - rc
      custom_version:
        description: >-
          Explicit target version, overrides release_type. Only needed for a
          version cargo-release's LEVEL keywords can't express directly, e.g.
          the first RC of a new major (9.0.0-rc.1 from 8.3.1) -- see
          docs/book/src/08-release-process.md.
        required: false
        type: string
      dry_run:
        description: Dry run (no changes committed or pushed)
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Bump ${{ inputs.release_type }}
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: release
    permissions:
      contents: write
      id-token: write # REL-05: OIDC token for crates-io-auth-action
    env:
      RELEASE_TYPE: ${{ inputs.release_type }}
      CUSTOM_VERSION: ${{ inputs.custom_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      # Runs before the ~6min cargo-release build so a bad dispatch fails in
      # seconds. Both checks below fired on run 33205154348, which died at the
      # bump step with cargo-release's misleading "unsupported release level
      # beta, only major, minor, and patch are supported".
      - name: Pre-flight
        env:
          TARGET_INPUT: ${{ inputs.custom_version || inputs.release_type }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin main:refs/remotes/origin/main

          # shared-version = true in release.toml, so every crate carries the
          # same version; core is the canonical one to read it from.
          read_version() { grep -m1 '^version = ' "$1" | cut -d'"' -f2; }

          develop_version=$(read_version core/Cargo.toml)
          main_version=$(git show origin/main:core/Cargo.toml | grep -m1 '^version = ' | cut -d'"' -f2)

          # semver-aware "is $1 strictly lower than $2". `sort -V` ranks
          # 9.0.0-rc.13 ABOVE 9.0.0, which is backwards for semver; rewriting
          # the pre-release hyphen as `~` restores the right order, since GNU
          # sort ranks `~` before everything including the empty string.
          ver_lt() {
            [ "$1" = "$2" ] && return 1
            local a b
            a=${1/-/\~}
            b=${2/-/\~}
            [ "$(printf '%s\n%s\n' "$a" "$b" | sort -V | head -1)" = "$a" ]
          }

          # A release cut on main bumps the version there. Until that commit is
          # back-merged, this workflow reads a stale version off develop and
          # every relative bump is computed from the wrong base -- silently, in
          # the `rc` case: 9.0.0-rc.13 + rc = 9.0.0-rc.14, a version BEHIND the
          # already-published 9.0.0. Version comparison rather than ancestry, so
          # the guard holds whether the back-merge PR is merged or squashed.
          if ver_lt "$develop_version" "$main_version"; then
            echo "::error::develop is at $develop_version but main is already at $main_version. Back-merge main into develop before releasing -- see docs/book/src/08-release-process.md."
            exit 1
          fi

          # cargo-release refuses rc -> beta (src/ops/version.rs, increment_beta)
          # but reports it as an unsupported level, which reads like the keyword
          # itself is gone. Say what actually happened.
          case "$develop_version" in
            *-rc.*)
              if [ "$TARGET_INPUT" = "beta" ]; then
                echo "::error::Current version is $develop_version. A pre-release cycle cannot go from rc back to beta -- use release_type: rc, or custom_version for a new line."
                exit 1
              fi
              ;;
          esac

          echo "Pre-flight ok: develop=$develop_version, main=$main_version, target=$TARGET_INPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Install cargo-release
        run: cargo install cargo-release --locked --force

      - name: Install git-cliff
        run: cargo install git-cliff --locked --force

      - name: Configure git identity
        run: |
          git config user.name "Samuel Galvão Elias"
          git config user.email "sgelias@outlook.com"

      - name: Resolve target level/version
        run: |
          if [ -z "$CUSTOM_VERSION" ] && [ -z "$RELEASE_TYPE" ]; then
            echo "::error::Either release_type or custom_version must be set."
            exit 1
          fi
          echo "TARGET=${CUSTOM_VERSION:-$RELEASE_TYPE}" >> "$GITHUB_ENV"

      - name: Bump version, changelog, commit (dry run)
        if: inputs.dry_run == true
        run: |
          cargo release "$TARGET" --no-publish --no-tag --no-push
          echo "Dry-run complete — no changes were committed or pushed."

      - name: Bump version, changelog, commit (no publish/tag/push yet)
        if: inputs.dry_run == false
        run: cargo release "$TARGET" --execute --no-confirm --no-publish --no-tag --no-push

      # REL-05/06: short-lived OIDC token, not a stored secret. Requires
      # Trusted Publishing configured on crates.io for every crate first
      # (see docs/book/src/08-release-process.md) -- until then this step
      # fails and CARGO_REGISTRY_TOKEN below is the fallback.
      - name: Authenticate to crates.io (Trusted Publishing)
        if: inputs.dry_run == false
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crates
        if: inputs.dry_run == false
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        # release.toml's [rate-limit] paces publishes to stay under crates.io's
        # documented limits. If this step still fails partway (crates.io
        # throttling, network blip): nothing has been pushed yet (see design
        # doc §2) -- re-dispatching this same workflow is safe for a fixed
        # bump, but NOT for rc/beta (it would bump again instead of retrying).
        # See docs/book/src/08-release-process.md for the full recovery
        # procedure.
        run: |
          cargo release publish --execute --no-confirm
          echo "Publish complete."

      - name: Tag and push
        if: inputs.dry_run == false
        run: |
          cargo release tag --execute --no-confirm
          cargo release push --execute --no-confirm
          echo "Release complete."
