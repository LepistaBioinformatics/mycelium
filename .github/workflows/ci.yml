name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Native build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libpq-dev libssl-dev pkg-config cmake nasm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace --locked --no-default-features --features full

  standalone-build:
    name: Standalone Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Native build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libpq-dev libssl-dev pkg-config cmake nasm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build standalone binary
        run: cargo build -p mycelium-api --no-default-features --features standalone --locked

      - name: Test standalone port
        run: cargo test --workspace --no-default-features --features standalone --locked

  postgres-only-build:
    name: Postgres-only Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Native build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libpq-dev libssl-dev pkg-config cmake nasm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build postgres-only binary
        run: cargo build -p mycelium-api --no-default-features --features postgres-only --locked

      - name: Test postgres-only port
        run: cargo test --workspace --no-default-features --features postgres-only --locked

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Native build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libpq-dev libssl-dev pkg-config cmake nasm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --all --locked --no-default-features --features full

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
