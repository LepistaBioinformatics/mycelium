<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Link accounts{% endblock title %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', 'Open Sans', Arial, sans-serif;
      background: #f5f3ff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 0 16px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 48px 40px;
      max-width: 460px;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
    }
    .brand {
      font-size: 13px;
      font-weight: 600;
      color: #8b5cf6;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    h1 { font-size: 22px; color: #4c1d95; margin-bottom: 8px; }
    h1.error-title { color: #ef4444; }
    p { color: #555; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
    .accounts {
      text-align: left;
      background: #faf9ff;
      border: 1px solid #ede9fe;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 14px;
      color: #333;
    }
    .accounts dt { font-size: 12px; color: #888; margin-top: 8px; }
    .accounts dt:first-child { margin-top: 0; }
    .accounts dd { margin: 2px 0 0; font-weight: 600; word-break: break-all; }
    button {
      width: 100%;
      padding: 12px;
      background: #8b5cf6;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .note { font-size: 12px; color: #999; margin-top: 16px; margin-bottom: 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">{{ instance_name | default(value="Mycelium") }}</div>
    {% block content %}{% endblock content %}
  </div>
</body>
</html>
