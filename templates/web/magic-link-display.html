<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ domain_name }} — Login Code</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', 'Open Sans', Arial, sans-serif;
      background: #f5f3ff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .brand {
      font-size: 13px;
      font-weight: 600;
      color: #8b5cf6;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 22px;
      color: #4c1d95;
      margin-bottom: 8px;
    }
    p {
      color: #555;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .check-badge {
      margin-bottom: 16px;
    }
    .code {
      display: inline-block;
      background: #bae6fd;
      border-radius: 6px;
      padding: 16px 40px;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 36px;
      font-weight: bold;
      letter-spacing: 0.18em;
      color: #1a1a1a;
      margin-bottom: 16px;
    }
    .copy-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1px solid #ddd6fe;
      color: #6d28d9;
      border-radius: 6px;
      padding: 8px 16px;
      font-family: 'Inter', 'Open Sans', Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 24px;
    }
    .copy-button:hover {
      background: #f5f3ff;
    }
    .note {
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">{{ domain_name }}</div>
    <svg class="check-badge" width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="12" cy="12" r="10" stroke="#8b5cf6" stroke-width="1.5"/>
      <path d="M8 12.5L10.5 15L16 9" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Your {{ domain_name }} Login Code</h1>
    <p>
      Enter the code below in the app to complete your login.<br/>
      This code expires in {{ expires_in_minutes }} minutes and can only be used once.
    </p>
    <div class="code" id="login-code">{{ code }}</div>
    <br/>
    <button type="button" class="copy-button" id="copy-button" onclick="copyCode()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <path d="M6 15H4.5a1.5 1.5 0 0 1-1.5-1.5V4.5A1.5 1.5 0 0 1 4.5 3H13.5A1.5 1.5 0 0 1 15 4.5V6" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <span id="copy-label">Copy code</span>
    </button>
    <p class="note">
      If you did not request this code, you can safely close this page.
    </p>
  </div>
  <script>
    function copyCode() {
      var code = document.getElementById('login-code').textContent.trim();
      var label = document.getElementById('copy-label');
      var reset = function () { label.textContent = 'Copy code'; };
      try {
        navigator.clipboard.writeText(code).then(function () {
          label.textContent = 'Copied';
          setTimeout(reset, 1500);
        });
      } catch (err) {
        // Clipboard API unavailable — the code is still visible and selectable.
      }
    }
  </script>
</body>
</html>
