<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ domain_name }} — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', 'Open Sans', Arial, sans-serif;
      background: #f5f3ff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 0 16px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
    }
    .brand {
      font-size: 13px;
      font-weight: 600;
      color: #8b5cf6;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 22px;
      color: #4c1d95;
      margin-bottom: 8px;
    }
    h1.error-title { color: #ef4444; }
    p {
      color: #555;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    label {
      display: block;
      text-align: left;
      font-size: 13px;
      font-weight: 500;
      color: #333;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      margin-bottom: 16px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: 'Inter', 'Open Sans', Arial, sans-serif;
      font-size: 14px;
    }
    input[name="code"] {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 22px;
      letter-spacing: 0.3em;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #8b5cf6;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .feedback {
      font-size: 13px;
      color: #ef4444;
      margin-bottom: 16px;
    }
    .note {
      font-size: 12px;
      color: #999;
      margin-top: 16px;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">{{ domain_name }}</div>
    <h1>Sign in</h1>
    <p>Enter your email address. We will send you a 6-digit code.</p>

    {% if error %}<div class="feedback" role="alert">{{ error }}</div>{% endif %}

    <form method="post" action="{{ form_action }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required autofocus />
      <button type="submit">Send code</button>
    </form>
  </div>
</body>
</html>
