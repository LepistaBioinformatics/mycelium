[package]
name = "mycelium-config"
description = "Provide config manager features of the Mycelium project as and use-cases."

version = "9.0.0-rc.2"

edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true


# ? ----------------------------------------------------------------------------
# ? DEPENDENCIES
# ? ----------------------------------------------------------------------------

[features]

# Autogen + persisted secrets for standalone mode (SM-R9, DEC-2): OS keyring
# preferred, encrypted local file as fallback. Full mode is unaffected --
# `SecretResolver::Env`/`Value` cover the explicit-secret path already.
standalone-secrets = ["dep:keyring", "dep:ring", "dep:uuid"]

[dependencies]

lazy_static.workspace = true
reqwest.workspace = true
serde.workspace = true
tracing.workspace = true
toml.workspace = true
utoipa.workspace = true

keyring = { version = "3", features = ["sync-secret-service", "vendored"], optional = true }
ring = { version = "0.17", optional = true }
uuid = { workspace = true, optional = true }

# ------------------------------------------------------------------------------
# Mycelium packages
# ------------------------------------------------------------------------------

mycelium-base.workspace = true

# ? ----------------------------------------------------------------------------
# ? DEV DEPENDENCIES
# ? ----------------------------------------------------------------------------

[dev-dependencies]
tokio.workspace = true

# ? ----------------------------------------------------------------------------
# ? LIBRARY
# ? ----------------------------------------------------------------------------

[lib]
name = "myc_config"
path = "src/lib.rs"
crate-type = ["staticlib", "lib"]
