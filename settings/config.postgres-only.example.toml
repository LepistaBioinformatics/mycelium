# ==============================================================================
# POSTGRES-ONLY MODE — example configuration
#
# This is the config surface for the Redis-free `postgres-only` build:
#   cargo build --no-default-features --features postgres-only,rhai -p mycelium-api
# (or, once published, the Docker image built with
#   --build-arg CARGO_FEATURES=postgres-only,rhai).
#
# It runs full PostgreSQL persistence, real SMTP email, and multi-pod horizontal
# scaling — but the KV/artifact cache lives in a Postgres table (`kv_artifact`)
# instead of Redis, so there is NO `[redis]` section: this build never reads it
# (a present `[redis]` is ignored, not an error).
#
# Apply the schema first (base DDL already includes the `kv_artifact` table and
# the message_queue claim index):
#   psql <url> -f adapters/diesel_postgres/sql/up.sql -v db_name=... -v db_role=...
#
# Looking for full mode (Postgres + Redis)? Use the default build and a config
# that includes `[redis]`. Looking for zero-dependency evaluation? See
# config.standalone.example.toml.
# ==============================================================================

vault = "disabled"

# ------------------------------------------------------------------------------
# CORE
# ------------------------------------------------------------------------------

[core.accountLifeCycle]
domainName = "Mycelium"
domainUrl = "http://localhost:8080"
tokenExpiration = 3600
noreplyName = "NoReply"
noreplyEmail = "noreply@example.com"
supportName = "Support"
supportEmail = "support@example.com"
locale = "en-us"
# ! In production resolve from vault/env, never inline.
tokenSecret = { env = "MYC_TOKEN_SECRET" }
hmacPrimaryVersion = 1

[[core.accountLifeCycle.hmacSecrets]]
version = 1
secret = { env = "MYC_HMAC_SECRET_V1" }

# ? ----------------------------------------------------------------------------
# ? Downstream profile signature (no configuration)
#
# The gateway signs every `x-mycelium-profile` it injects and adds
# `x-mycelium-profile-signature` (compact JWS, `alg: EdDSA`, `kid: <version>`,
# claims `{iat, ph, aud}`). There is nothing to configure: one Ed25519 key is
# derived (HKDF-SHA256) from each entry of `core.accountLifeCycle.hmacSecrets`
# above, the entry's `version` is the `kid`, and `hmacPrimaryVersion` selects
# the signing key. Both features therefore rotate together; always add a new
# version, never replace the secret of an existing one. Use secrets of at
# least 32 random bytes.
#
# The public halves are published at
# GET /.well-known/mycelium-profile-jwks.json; downstream services point
# MYCELIUM_JWKS_URL at it (and set MYC_PROFILE_SIGNATURE_AUDIENCE) to verify.
# See the "Downstream profile signature" book chapter.
# ? ----------------------------------------------------------------------------

[core.webhook]
acceptInvalidCertificates = false
consumeIntervalInSecs = 30
consumeBatchSize = 25
maxAttempts = 5

# Bounds every outbound call; without them a hung downstream holds the
# dispatcher open forever.
requestTimeoutInSecs = 30
connectTimeoutInSecs = 10

# Retry spacing: 30, 60, 120, 240, 480 seconds, capped at an hour.
retryBaseInSecs = 30
retryCapInSecs = 3600

# Crash recovery for a claimed batch, NOT retry spacing. MUST exceed the
# worst-case wall-clock of one whole batch (floor:
# consumeBatchSize * requestTimeoutInSecs = 750s here), or a live-but-slow
# replica has its undispatched rows reclaimed and the webhook is sent twice.
visibilityTimeoutInSecs = 900

# ------------------------------------------------------------------------------
# DOWNSTREAM SERVICE NOTIFICATIONS
#
# Lets a downstream service send emails through the gateway with a
# notification connection string (POST /_adm/notifications/email). Dormant
# until a service declares a `[<service>.notifications]` block (example under
# `[api.services]` below). This block is then optional except `templatesDir`,
# which becomes required. Every key below shows its default.
#
# ROLLOUT: add the first `notifications` block only after EVERY gateway pod
# runs a version that supports it. ROLLBACK: before going back to an older
# version, delete every notification connection string first. See the
# "Downstream APIs" book chapter (Sending emails from a service).
# ------------------------------------------------------------------------------

#[core.serviceNotifications]
#
## "header" keeps `From` equal to `noreplyEmail` and carries the service tag
## in the X-Mycelium-Source-Service header: works with every provider. "plus"
## sends from <local>+<senderTag>@<domain>; turn it on only after checking
## that your provider accepts those senders (Google SMTP needs a send-as alias
## or the SMTP relay; Azure Communication Services needs each sender
## username registered on the verified domain).
#senderTagMode = "header"
#
## Upper bound, in days, for the expiration of a notification string.
#maxConnectionStringTtlInDays = 90
#
## Days the notification dispatch trace is kept; purged at most once an hour.
#retentionDays = 90
#
## Root of the service templates: <templatesDir>/<senderTag>/<locale>/
## <name>.jinja (body) and <name>.subject. Must not equal, contain or sit
## inside TEMPLATES_DIR. Every declared template must exist for `en-us`; a
## missing or malformed template fails the boot.
#templatesDir = "service-templates"

# ------------------------------------------------------------------------------
# SQL DATABASE (PostgreSQL)
# ------------------------------------------------------------------------------

[diesel]
# ! In production resolve from vault/env.
databaseUrl = { env = "DATABASE_URL" }

# ------------------------------------------------------------------------------
# NOTIFIER — real SMTP (no Redis queue; the email queue is the Postgres
# `message_queue` table, claimed multi-pod-safe via SELECT ... FOR UPDATE SKIP
# LOCKED). `[queue]` only tunes the in-process dispatcher poll.
#
# ------------------------------------------------------------------------------

[smtp]
host = "smtp.example.com"
username = { env = "SMTP_USERNAME" }
password = { env = "SMTP_PASSWORD" }
port = 465
# TLS mode: "implicit" (port 465) or "starttls" (port 587). Optional -- when
# omitted it is auto-selected from `port` (587 -> starttls, else implicit); any
# other port (e.g. 25) defaults to implicit, so set `security` explicitly there.
# security = "starttls"

[queue]
emailQueueName = "emails"
consumeIntervalInSecs = 15
# Multi-pod claim tuning (also honored in full mode). The claim marks a batch
# invisible to other pods for `visibilityTimeoutSecs`; this window doubles as
# the retry back-off for a failed send. SAFETY INVARIANT:
#   visibilityTimeoutSecs > claimBatchSize * worst-case single SMTP send.
# Defaults (batch 3, window 240s) are safe for lettre's ~60s default send
# timeout. Lower the window for faster retries (e.g. time-sensitive OTP) only
# after lowering the batch so the invariant still holds.
claimBatchSize = 3
visibilityTimeoutSecs = 240

# ------------------------------------------------------------------------------
# AUTHENTICATION
# ------------------------------------------------------------------------------

[auth.internal.enabled]
jwtSecret = { env = "MYC_JWT_SECRET" }
jwtExpiresIn = 43200
tmpExpiresIn = 300

# Gateway-hosted email login (OAuth 2.0 authorization code + PKCE S256).
# Optional -- disabled when omitted. Each client lists the exact redirect URIs
# the gateway may send the browser back to (no prefix or wildcard matching).
# The client's origin must also be in `api.allowedOrigins` for the
# `POST /_adm/hosted-login/token` call.
#
# [auth.hostedLogin.define]
# clients = [
#   { clientId = "webapp", redirectUris = ["http://localhost:5173/callback"] },
# ]

# ------------------------------------------------------------------------------
# API PORT
# ------------------------------------------------------------------------------

[api]
serviceIp = "0.0.0.0"
servicePort = 8080
serviceWorkers = 1
callbackExecutionMode = "fireAndForget"
gatewayTimeout = 60
healthCheckInterval = 120
maxRetryCount = 3
allowedOrigins = ["http://localhost:8080"]
tls = "disabled"

[api.cache]
jwksTtl = 3600
emailTtl = 120
profileTtl = 60

[api.logging]
level = "info"
format = "ansi"
target = "stdout"

# ------------------------------------------------------------------------------
# API GATEWAY ROUTE CONFIGURATION
#
# Optional. See config.full.example.toml for a complete reference example of
# `[api.services]` (secrets, role-protected routes, retries, ...).
# ------------------------------------------------------------------------------

#[api.services]
#
#[[service-01]]
#host = "127.0.0.1:8787"
#protocol = "http"
#healthCheckPath = "/health"
#
#[[service-01.path]]
#group = "public"
#path = "/public"
#methods = ["GET"]
#
## Email notifications sent by service-01 (deny by default: without this
## block the service can neither get notification strings nor send). Needs
## `[core.serviceNotifications].templatesDir`. `quotaPerHour` is shared by all
## gateway pods; `maxRecipientsPerMessage` must not exceed it.
#[service-01.notifications]
#senderTag = "service-01"
#displayName = "Service 01"
#issuerRoles = ["service-01-admin"]
#issuerTenants = []
## owner | tenantMembers (needs a tenant-bound string) | domains | any
#recipientPolicy = "owner"
#allowedDomains = []
#templates = ["welcome"]
#quotaPerHour = 100
#maxRecipientsPerMessage = 10
