[package]
name = "mycelium-diesel"
description = "Provide diesel adapters to the mycelium project."

version = "8.3.1-rc.5"

edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true


[features]
default = ["postgres"]

# Full mode: PostgreSQL backend (links libpq).
postgres = ["diesel/postgres"]

# Standalone mode: SQLite backend with libsqlite3 compiled into the binary
# (no system libsqlite runtime dep) + embedded migrations for auto-provisioning.
# `returning_clauses_for_sqlite_3_35` enables `RETURNING` on insert/update
# statements (SQLite >= 3.35, satisfied by the bundled version) so repositories
# can read back generated/updated rows the same way the postgres ones do.
sqlite = [
    "diesel/sqlite",
    "diesel/returning_clauses_for_sqlite_3_35",
    "libsqlite3-sys/bundled",
    "dep:diesel_migrations",
]

[dependencies]

# Backend features (postgres/sqlite) are selected via this crate's own features
# above; keep only backend-agnostic diesel features enabled unconditionally.
diesel = { version = "2", features = ["uuid", "serde_json", "chrono", "r2d2"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"], optional = true }
diesel_migrations = { version = "2", optional = true }

async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
env_logger.workspace = true
futures.workspace = true
lazy_static.workspace = true
serde.workspace = true
serde_json.workspace = true
shaku.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

# ------------------------------------------------------------------------------
# Mycelium packages
# ------------------------------------------------------------------------------

myc-core.workspace = true
mycelium-base.workspace = true
mycelium-config.workspace = true

# ------------------------------------------------------------------------------
# Dev dependencies
# ------------------------------------------------------------------------------


[lib]
name = "myc_diesel"
path = "src/lib.rs"
crate-type = ["staticlib", "lib"]
