[package]
name = "mycelium-notifier"
description = "Provide message adapters to the mycelium project."

version = "9.0.1-beta.1"

edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true


[features]

# Enables local (non-SMTP) transports for standalone mode: `StubTransport`
# (always available, no extra lettre feature) and `FileTransport` (write
# `.eml` files, requires lettre's `file-transport`). Full mode keeps `lettre`
# featureless and unchanged (SM-R14).
local-transport = ["lettre/file-transport", "dep:html2text"]

[dependencies]

async-trait.workspace = true
chrono.workspace = true
html2text = { workspace = true, optional = true }
lazy_static.workspace = true
lettre.workspace = true
redis.workspace = true
serde.workspace = true
serde_json.workspace = true
shaku.workspace = true
tracing.workspace = true
uuid.workspace = true

# ------------------------------------------------------------------------------
# Mycelium packages
# ------------------------------------------------------------------------------

myc-core.workspace = true
mycelium-base.workspace = true
mycelium-config.workspace = true
mycelium-adapters-shared-lib.workspace = true

# ------------------------------------------------------------------------------
# Dev dependencies
# ------------------------------------------------------------------------------

[dev-dependencies]
tokio.workspace = true
toml.workspace = true
tracing-subscriber.workspace = true

# ------------------------------------------------------------------------------
# Library
# ------------------------------------------------------------------------------

[lib]
name = "myc_notifier"
path = "src/lib.rs"
crate-type = ["staticlib", "lib"]
