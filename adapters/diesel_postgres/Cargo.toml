[package]
name = "mycelium-diesel"
description = "Provide diesel adapters to the mycelium project."

version = "9.0.0-rc.6"

edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true


[dependencies]

# RUSTSEC-2026-0136 / RUSTSEC-2026-0137: force diesel >= 2.3.8 (command
# injection in COPY FROM/TO; unaligned access in SqliteAggregate impls).
diesel = { version = "2.3.8", features = [
    "postgres",
    "uuid",
    "serde_json",
    "chrono",
    "r2d2",
] }

async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
env_logger.workspace = true
futures.workspace = true
lazy_static.workspace = true
serde.workspace = true
serde_json.workspace = true
shaku.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

# ------------------------------------------------------------------------------
# Mycelium packages
# ------------------------------------------------------------------------------

myc-core.workspace = true
mycelium-base.workspace = true
mycelium-config.workspace = true

# ------------------------------------------------------------------------------
# Dev dependencies
# ------------------------------------------------------------------------------


[lib]
name = "myc_diesel"
path = "src/lib.rs"
crate-type = ["staticlib", "lib"]
