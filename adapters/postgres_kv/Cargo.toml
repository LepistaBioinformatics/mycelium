[package]
name = "mycelium-postgres-kv"
description = "Provide a Postgres-backed key-value cache adapter to the mycelium project (postgres-only mode, no Redis)."

version = "9.0.1-beta.1"

edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true


[dependencies]

diesel = { version = "2.3.8", features = [
    "postgres",
    "uuid",
    "serde_json",
    "chrono",
    "r2d2",
] }

async-trait.workspace = true
chrono.workspace = true
shaku.workspace = true
tokio.workspace = true
tracing.workspace = true

# ------------------------------------------------------------------------------
# Mycelium packages
# ------------------------------------------------------------------------------

myc-core.workspace = true
mycelium-base.workspace = true

# ------------------------------------------------------------------------------
# Dev dependencies
# ------------------------------------------------------------------------------

[dev-dependencies]
tokio.workspace = true

[lib]
name = "myc_postgres_kv"
path = "src/lib.rs"
